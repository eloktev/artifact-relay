name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.7.0"

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync dependencies from the lock file
        run: uv sync --frozen --extra dev

      - name: Fail if uv.lock is out of date
        run: uv lock --check

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: Tests
        run: uv run pytest -q --cov=artifact_relay --cov-report=term-missing

      - name: Generated assets are in sync
        run: |
          uv run python -m artifact_relay.build_assets
          git diff --exit-code -- src/artifact_relay/static/css/highlight.css

      - name: Vendored bundle integrity
        run: |
          grep -q "$(sha256sum src/artifact_relay/static/js/mermaid.min.js | cut -d' ' -f1)" \
            src/artifact_relay/static/js/VENDOR.md

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      # Audit the locked dependency set rather than the installed environment: the local
      # project itself is not on PyPI, and this is exactly what ships in the image.
      - name: Export locked dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements-prod.txt
          uv export --frozen --all-extras --no-emit-project --format requirements-txt -o requirements-all.txt

      - name: pip-audit (runtime dependencies)
        run: uv run pip-audit --strict --progress-spinner=off -r requirements-prod.txt

      - name: pip-audit (including dev tooling)
        run: uv run pip-audit --strict --progress-spinner=off -r requirements-all.txt

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: artifact-relay:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The unit test asserts this about the Dockerfile; this asserts it about the artefact
      # that actually ships, which is what a deploy runs.
      - name: Image does not blanket-trust forwarded headers
        run: |
          CMD_JSON="$(docker inspect -f '{{json .Config.Cmd}}' artifact-relay:ci)"
          echo "CMD: $CMD_JSON"
          if grep -q -- '--forwarded-allow-ips' <<<"$CMD_JSON"; then
            echo "::error::the image hardcodes --forwarded-allow-ips, shadowing FORWARDED_ALLOW_IPS"
            exit 1
          fi
          grep -q -- '--proxy-headers' <<<"$CMD_JSON" || {
            echo "::error::the image lost --proxy-headers"; exit 1; }

      - name: Smoke test the container (publish -> login -> view -> restart -> delete)
        run: ./scripts/smoke.sh artifact-relay:ci 18080

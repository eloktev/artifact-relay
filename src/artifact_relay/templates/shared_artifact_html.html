{% extends "base.html" %}
{% block title %}{{ artifact.title }}{% endblock %}
{% block body_class %}page-doc page-embed{% endblock %}
{% block body %}
<div class="layout layout--embed">
  <header class="masthead">
    <p class="masthead__eyebrow">Артефакт по защищённой ссылке</p>
    <h1 class="masthead__title">{{ artifact.title }}</h1>
    {% if artifact.summary %}<p class="masthead__summary">{{ artifact.summary }}</p>{% endif %}
    <nav class="actions" aria-label="Действия">
      <button class="actions__item" type="button" data-action="print">Печать / PDF</button>
    </nav>
  </header>
  <iframe class="embed" title="{{ artifact.title }}" src="{{ raw_url }}"
          sandbox="{{ sandbox }}" referrerpolicy="no-referrer" loading="lazy"></iframe>
</div>
<script src="/static/js/artifact.js"></script>
{% endblock %}

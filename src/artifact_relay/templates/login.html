{% extends "base.html" %}
{% block title %}Вход · Artifact Relay{% endblock %}
{% block body_class %}page-centered{% endblock %}
{% block body %}
<main class="gate">
  <h1 class="gate__title">Artifact Relay</h1>
  <p class="gate__hint">Материал доступен после ввода пароля.</p>

  {% if error %}<p class="gate__error" role="alert">{{ error }}</p>{% endif %}

  <form class="gate__form" method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="gate__label" for="password">Пароль</label>
    <input class="gate__input" id="password" name="password" type="password"
           autocomplete="current-password" required autofocus
           enterkeyhint="go" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="gate__button" type="submit">Войти</button>
  </form>
</main>
{% endblock %}
